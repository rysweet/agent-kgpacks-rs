name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build / test / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        # `kgpacks-db` links LadybugDB (the `lbug` crate), which compiles its
        # bundled C++ engine from source via CMake. ubuntu-latest ships these,
        # but install them explicitly so the build never depends on the image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Copilot feature (real RustyClawd transport) — lint + test
        # The agent's real Copilot transport is gated behind the non-default
        # `copilot` feature so the gates above stay lean and fully offline. This
        # step compiles + lints + smoke-tests that wiring (in `kgpacks-agent`,
        # which has no LadybugDB dependency, so it is fast) so it never bitrots.
        # It fetches the SHA-pinned RustyClawd git dependency; the default gates
        # above do not. (`kgpacks-cli`'s thin `copilot` forwarder is covered by
        # the default-feature build; enabling it there would rebuild the lbug
        # engine via feature unification, so it is intentionally excluded here.)
        run: |
          cargo clippy -p kgpacks-agent --all-targets --features copilot --locked -- -D warnings
          cargo test -p kgpacks-agent --features copilot --locked
