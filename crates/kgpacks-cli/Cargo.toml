[package]
name = "kgpacks-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for agent-kgpacks-rs."

[features]
# Build the `kgpacks` binary with the real Copilot transport for the `ask`
# (graph-RAG) command. Off by default so the workspace gates stay lean/offline;
# the `ask` flow is proven by tests via an injected mock transport.
default = []
copilot = ["kgpacks-agent/copilot"]
# Build the `fetch-cve-corpus` command with the real GitHub release resolver +
# asset downloader. Off by default (mirrors `copilot`): the parity-critical
# selection/validation/provenance logic and the injected-seam orchestrator are
# fully tested in `kgpacks-corpus` without it.
net = ["kgpacks-corpus/net"]

[dependencies]
kgpacks-agent = { workspace = true }
kgpacks-corpus = { workspace = true }
kgpacks-db = { workspace = true }
kgpacks-embeddings = { workspace = true }
kgpacks-eval = { workspace = true }
kgpacks-ingestion = { workspace = true }
kgpacks-packs = { workspace = true }
kgpacks-query = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
kgpacks-agent = { workspace = true }
kgpacks-db = { workspace = true }
kgpacks-embeddings = { workspace = true }
kgpacks-packs = { workspace = true }
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "kgpacks"
path = "src/main.rs"
