name: pack-pull-signature
description: >-
  Outside-in cross-implementation check for the WS7 release-index signature path
  (kgpacks-cli `pack pull`, over kgpacks-packs::signing —
  verify_pack_index_signature / signature_plan / validate_signature_flags /
  SigningKeyPair). Drives the committed harness (qa/pull-signature/verify.sh),
  which signs a pack release index with Node's BUILT-IN Ed25519 (an
  implementation independent of the Rust ed25519-dalek), then verifies + pulls it
  through the real `kgpacks pack pull` command and asserts every branch of the
  fail-closed policy: a valid Node signature verifies (interop); an untrusted key
  and a tampered index are rejected (fail-closed); an unsigned index warns unless
  --require-signature (then fails); --no-verify skips; --require-signature with
  --no-verify is a usage error; and the committed DEFAULT trusted key rejects a
  foreign signature. Closes the WS7 half of agent-kgpacks-rs #22.
version: "1.0"
config:
  timeout: 900000
environment:
  requires:
    - "cargo (Rust toolchain) available on PATH"
    - "node available on PATH (runs the Ed25519 cross-implementation signer)"
    - "run from the agent-kgpacks-rs repo root"
agents:
  - name: cli
    type: cli
    config:
      workingDirectory: "."
metadata:
  tags: [cli, signing, ed25519, security, release, pack-pull, interop]
  priority: high
steps:
  - name: run cross-implementation signature verification check
    agent: cli
    action: run
    description: >-
      Sign a release index with Node's Ed25519, then verify + pull it with the
      Rust `kgpacks pack pull` across every signature-policy branch.
    params:
      command: "./qa/pull-signature/verify.sh"
  - name: signature verification is at parity across implementations
    agent: cli
    action: validate_output
    description: The harness reports full agreement between Node signing and Rust verifying.
    params:
      text: "PULL_SIGNATURE_OK"
  - name: harness exits cleanly
    agent: cli
    action: validate_exit_code
    description: A non-zero exit would signal a signature-policy divergence.
    params:
      text: "0"
assertions: []
