name: chunker-ts-parity
description: >-
  Outside-in cross-implementation parity check for the Rust text chunker
  (kgpacks-embeddings::chunker) against the canonical agent-kgpacks-ts
  windowText reference. Drives the committed parity harness
  (qa/chunker-parity/verify.sh), which diffs Rust chunk ids + contents against a
  golden generated by the real TypeScript oracle over a shared corpus covering
  overlap windowing, short text, Cyrillic multibyte, BOM/NEL trim parity, and
  interior-whitespace preservation.
version: "1.0"
config:
  timeout: 300000
environment:
  requires:
    - "cargo (Rust toolchain) available on PATH"
    - "run from the agent-kgpacks-rs repo root"
agents:
  - name: cli
    type: cli
    config:
      workingDirectory: "."
metadata:
  tags: [cli, parity, chunker, embeddings, ts-parity, issue-11]
  priority: high
steps:
  - name: run cross-implementation chunker parity check
    agent: cli
    action: run
    description: >-
      Run the Rust chunk_dump example over the shared corpus and diff it against
      the agent-kgpacks-ts golden (and the live TS oracle when node is present).
    params:
      command: "./qa/chunker-parity/verify.sh"
  - name: parity holds byte-for-byte
    agent: cli
    action: validate_output
    description: The harness reports byte-for-byte parity with the TS reference.
    params:
      text: "CHUNKER_PARITY_OK"
  - name: harness exits cleanly
    agent: cli
    action: validate_exit_code
    description: A non-zero exit would signal a parity divergence.
    params:
      text: "0"
assertions: []
