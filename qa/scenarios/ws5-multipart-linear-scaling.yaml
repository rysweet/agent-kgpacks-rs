name: ws5-multipart-linear-scaling
description: >-
  WS5 acceptance coverage for the >2 GiB multi-part release + streaming-install
  accounting and the linear-scaling loader guard. Drives the committed harness
  (qa/ws5-multipart-linear-scaling/verify.sh), which runs the WS5 test subset:
  the multi-part release accounting over a synthetic incompressible pack with a
  tiny part-size (>1 part; every non-final part == part_size;
  sum(parts.bytes) == total_bytes; per-part SHA-256 matches its bytes; overall
  SHA-256 == hash of the concatenated parts; byte-exact reassembly), the >2 GiB
  size accounting computed without materializing gigabytes, and the structural
  linear-scaling guards in both kgpacks-packs and kgpacks-ingestion (loading 2N
  records issues at most ~3x the statements of N, and NO edge-creation statement
  uses the O(N^2) comma two-pattern `MATCH (a {..}), (b {..})` — PK-indexed
  single-MATCH clauses only).
version: "1.0"
config:
  timeout: 900000
environment:
  requires:
    - "cargo (Rust toolchain) available on PATH"
    - "run from the agent-kgpacks-rs repo root"
agents:
  - name: cli
    type: cli
    config:
      workingDirectory: "."
metadata:
  tags: [ci, coverage, packs, ingestion, multipart, linear-scaling, ws5]
  priority: high
steps:
  - name: run WS5 multi-part + linear-scaling coverage
    agent: cli
    action: run
    description: >-
      Run the WS5 test subset (multi-part release accounting incl. >2 GiB, plus
      the packs + ingestion linear-scaling structural guards) via the committed
      harness.
    params:
      command: "./qa/ws5-multipart-linear-scaling/verify.sh"
  - name: WS5 coverage passes
    agent: cli
    action: validate_output
    description: The harness reports the WS5 coverage passed.
    params:
      text: "WS5_COVERAGE_OK"
  - name: harness exits cleanly
    agent: cli
    action: validate_exit_code
    description: A non-zero exit would signal a WS5 coverage failure.
    params:
      text: "0"
assertions: []
