name: cve-full-pack-eval-recall
app_type: cli
description: >
  WS1 (#16) — full-pack CVE eval validation. Evaluates the COMPLETE CVE question
  set (SampleMode::Full, not a sampled subset) and computes the deterministic,
  offline retrieval-recall (hit@k) fallback metric, asserting it equals the
  committed artifact numbers. Also confirms the committed artifact files carry the
  recall metric. Any non-zero command exit fails the scenario.
agents:
  - name: cargo
    type: cli
    command: bash
steps:
  - action: run
    description: Recompute full-pack recall@{1,3,5} and guard the committed artifact.
    params:
      command: "cd \"$(git rev-parse --show-toplevel)\" && cargo test -p kgpacks-eval --test full_pack_eval --locked"
    timeout: 300000
  - action: run
    description: The JSON artifact carries the retrieval-recall metric.
    params:
      command: "cd \"$(git rev-parse --show-toplevel)\" && grep -q recall_at_1 data/packs/cve/eval-results.json"
    timeout: 30000
  - action: run
    description: The Markdown artifact reports the recall table.
    params:
      command: "cd \"$(git rev-parse --show-toplevel)\" && grep -q 'recall@1' data/packs/cve/eval-results.md"
    timeout: 30000
assertions:
  - type: output_contains
    params:
      value: "test result: ok"
